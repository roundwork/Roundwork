<style>
  :root{
    --bg: #F4F6F4;
    --surface: #FFFFFF;
    --ink: #1E2A26;
    --ink-soft: #5B6B64;
    --line: #DCE3DE;
    --primary: #2F6E62;
    --primary-dark: #234F47;
    --accent: #C97B4A;
    --danger: #B5453D;
    --status-active: #2F6E62;
    --status-hold: #C97B4A;
    --status-discharged: #8A9690;
    --radius-sm: 6px;
    --radius-md: 10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    font-family:'Inter', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--ink);
    height:100%;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  #app{ display:flex; min-height:100vh; }

  /* ---------- Auth / lock screen ---------- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; width:100%; padding:20px; }
  .auth-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:32px; max-width:420px; width:100%; }
  .auth-card h1{ font-size:1.4rem; margin-top:0; margin-bottom:6px; }
  .auth-card p.sub{ color:var(--ink-soft); font-size:0.87rem; margin-bottom:20px; line-height:1.5; }
  .auth-error{ color:var(--danger); font-size:0.82rem; margin-top:8px; }
  .auth-forgot{ margin-top:18px; font-size:0.8rem; text-align:center; color:var(--ink-soft); }
  .recovery-code-box{ font-family:monospace; font-size:1.15rem; letter-spacing:0.06em; background:#F4F6F4; border:1px dashed var(--primary); border-radius:var(--radius-sm); padding:16px; text-align:center; word-break:break-all; margin-top:14px; color:var(--primary-dark); font-weight:600; }
  .auth-forgot a{ color:var(--ink-soft); cursor:pointer; text-decoration:underline; }
  .auth-note{ background:#FBF6F1; border:1px solid #EAD9C6; border-radius:var(--radius-sm); padding:10px 12px; font-size:0.78rem; color:#6B5236; margin-top:14px; line-height:1.5;}

  /* ---------- Sidebar ---------- */
  nav.sidebar{
    width:220px; flex-shrink:0;
    background:var(--primary-dark);
    color:#EAF1EE;
    display:flex; flex-direction:column;
    padding:20px 14px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-size:1.25rem;
    font-weight:700;
    color:#fff;
    padding:4px 8px 22px 8px;
    line-height:1.2;
  }
  .brand small{display:block; font-family:'Inter',sans-serif; font-weight:400; font-size:0.7rem; color:#B9CFC8; letter-spacing:.02em; margin-top:3px;}
  .navlink{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:var(--radius-sm);
    color:#CFE0DA; text-decoration:none; font-size:0.92rem; font-weight:500;
    cursor:pointer; margin-bottom:2px; border:none; background:none; text-align:left; width:100%;
  }
  .navlink:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  .navlink.active{ background:var(--primary); color:#fff; }
  .navlink .ic{ width:18px; text-align:center; font-size:1rem; }
  .sidebar-foot{ margin-top:auto; font-size:0.72rem; color:#8FADA4; padding:8px; }
  .lockbtn{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:#DCEAE6; padding:8px 12px; border-radius:var(--radius-sm); font-size:0.82rem; cursor:pointer; width:100%; margin-top:10px; }
  .lockbtn:hover{ background:rgba(255,255,255,0.12); }

  @media (max-width: 780px){
    nav.sidebar{
      position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; width:100%;
      flex-direction:row; justify-content:space-around; padding:8px 4px; align-items:center;
      z-index:50; overflow-x:auto;
    }
    .brand{display:none;}
    .sidebar-foot{display:none;}
    .navlink{ flex-direction:column; gap:2px; font-size:0.6rem; padding:6px 4px; text-align:center;}
    .navlink .ic{ font-size:1.1rem; }
    .lockbtn{ width:auto; flex-direction:column; font-size:0.6rem; padding:6px 8px; margin-top:0; gap:2px;}
    main{ padding-bottom:80px !important; }
  }

  main{ flex:1; padding:32px 40px; max-width:1000px; }
  @media (max-width: 780px){ main{ padding:20px 16px; } }

  .page-head{ margin-bottom:24px; }
  .page-head h1{ font-size:1.7rem; margin:0 0 4px 0; }
  .page-head p{ color:var(--ink-soft); margin:0; font-size:0.94rem; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:18px 20px;
  }
  .grid-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; }
  .stat .num{ font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600; line-height:1; }
  .stat .lbl{ color:var(--ink-soft); font-size:0.8rem; margin-top:6px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--primary); color:#fff; border:none;
    padding:10px 16px; border-radius:var(--radius-sm);
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.88rem;
    cursor:pointer; text-decoration:none;
  }
  .btn:hover{ background:var(--primary-dark); }
  .btn.secondary{ background:transparent; color:var(--primary); border:1px solid var(--primary); }
  .btn.secondary:hover{ background:rgba(47,110,98,0.08); }
  .btn.danger{ background:var(--danger); }
  .btn.danger:hover{ background:#8f342e; }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn.full{ width:100%; justify-content:center; }

  input,textarea,select{
    font-family:'Inter',sans-serif; font-size:0.92rem;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 11px; width:100%; background:#fff; color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  label{ font-size:0.8rem; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .field-row{ grid-template-columns:1fr; } }

  .client-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; background:var(--surface);
    border:1px solid var(--line); border-left:4px solid var(--status-active);
    border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer;
  }
  .client-row:hover{ border-color:var(--primary); }
  .client-row.hold{ border-left-color: var(--status-hold); }
  .client-row.discharged{ border-left-color: var(--status-discharged); opacity:0.75; }
  .client-row .name{ font-weight:600; font-size:0.98rem; }
  .client-row .meta{ color:var(--ink-soft); font-size:0.8rem; margin-top:2px; }
  .client-row .spacer{ flex:1; }
  .pill{ font-size:0.7rem; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .pill.active{ background:#E4F0EC; color:var(--status-active); }

<meta name="theme-color" content="#234F47">

<body>
<div id="app"></div>

<script>
/* ===========================================================
   ROUNDWORK — caseload + session companion for PT/OT
   All clinical data is encrypted client-side (AES-GCM, key
   derived from a passphrase via PBKDF2) before being saved to
   this browser's own local storage (IndexedDB). There is no
   account system and no server — each browser/device that opens
   this file keeps its own separate, private data.
=========================================================== */

const STATUS_LABEL = { active:'Active', hold:'On hold', discharged:'Discharged' };
const APPT_STATUS_LABEL = { scheduled:'Scheduled', completed:'Completed', cancelled:'Cancelled', 'no-show':'No-show' };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let state = {
  authMode: 'checking', // checking | setup | unlock | unlocked
  authError: '',
  authBusy: false,
  authStep: '',
  meta: null,
  cryptoKey: null,
  pendingRecoveryCode: '',
  recoveredMasterKeyBytes: null,

  view: 'dashboard',
  clientId: null,
  clientTab: 'notes',
  clients: [],
  notesCache: {},
  appointments: [],
  attachIndexCache: {},
  search: '',
  editingClient: null,
  calendar: { year: new Date().getFullYear(), month: new Date().getMonth() },
  recording: { active:false, seconds:0, timer:null, transcript:'', recog:null, mediaRecorder:null, chunks:[], audioUrl:null, supported:true, error:'' },
  _pendingTranscript: ''
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }); }
function fmtTime(secs){ const m = Math.floor(secs/60).toString().padStart(2,'0'); const s = Math.floor(secs%60).toString().padStart(2,'0'); return m+':'+s; }
function fmtBytes(n){ if(!n) return '0 KB'; if(n<1024*1024) return Math.round(n/1024)+' KB'; return (n/(1024*1024)).toFixed(1)+' MB'; }

/* ---- Surface failures instead of hanging silently ---- */
function showFatalBanner(msg){
  let el = document.getElementById('fatalBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatalBanner';
    el.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#B5453D; color:#fff; padding:10px 14px; font-size:0.78rem; z-index:9999; font-family:sans-serif; line-height:1.4;';
    document.body.appendChild(el);
  }
  el.textContent = 'Roundwork hit a problem: ' + msg;
}
window.addEventListener('error', (e)=>{
  // Browsers deliberately strip all detail from errors originating in a
  // cross-origin or opaque-response context (a bare "Script error." with
  // no filename/line number) -- this is a browser privacy protection, not
  // a description of a real bug, and there's nothing actionable to show
  // the user for it. Log it quietly for our own diagnostics instead of
  // alarming a real customer with an unhelpful banner.
  const isOpaque = e && e.message === 'Script error.' && !e.filename;
  if(isOpaque){
    console.warn('Suppressed opaque cross-origin error (no detail available from browser):', e);
    return;
  }
  showFatalBanner((e && e.message) ? e.message : 'unknown script error');
});
window.addEventListener('unhandledrejection', (e)=>{
  const reason = e && e.reason;
  showFatalBanner(reason && reason.message ? reason.message : String(reason));
});
// Surface any errors happening inside the service worker itself (a separate
// execution context we can't see directly) so they're at least visible in
// the console for real debugging, without alarming the user unnecessarily.
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (event)=>{
    if(event.data && event.data.type === 'sw-error'){
      console.error('Service worker reported an internal error:', event.data.detail);
    }
  });
}
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error((label||'This step') + " timed out — the app's storage didn't respond within " + Math.round(ms/1000) + 's.')), ms))
  ]);
}

/* ---- Local, per-device storage (IndexedDB) ----
   Roundwork runs standalone: everything is saved in the browser's
   own storage on whichever device it's opened on. There's no
   account system and no server — one browser profile is one
   caseload, automatically separate from any other device or
   browser that opens this same file. If IndexedDB is somehow
   unavailable, this falls back to in-memory storage for the
   current tab so the app still works, with a visible notice. */
const DB_NAME = 'roundwork_local_db';
const DB_STORE = 'kv';
let dbPromise = null;
function openDb(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('IndexedDB is not available in this browser context')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath:'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB failed to open'));
  });
  return dbPromise;
}
let storageFallbackActive = false;
const memoryStore = {};
function showStorageFallbackNotice(){
  if(document.getElementById('storageFallbackBanner')) return;
  const el = document.createElement('div');
  el.id = 'storageFallbackBanner';
  el.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#C97B4A; color:#fff; padding:8px 14px; font-size:0.76rem; z-index:9998; font-family:sans-serif; text-align:center; line-height:1.4;';
  el.textContent = "This browser isn't letting Roundwork save to local storage, so it's running in this-tab-only mode — your work will be lost if you close or refresh. This can happen in private/incognito windows or very restricted browser settings.";
  document.body.appendChild(el);
}
async function storageSet(key, value){
  memoryStore[key] = value;
  try{
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put({ key, value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.warn('IndexedDB set failed, using in-memory store for this session', e);
    storageFallbackActive = true;
    showStorageFallbackNotice();
  }
}
async function storageGet(key){
  try{
    const db = await openDb();
    const value = await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
    if(value !== null && value !== undefined) return { key, value };
    if(Object.prototype.hasOwnProperty.call(memoryStore, key)) return { key, value: memoryStore[key] };
    return null;
  }catch(e){
    if(Object.prototype.hasOwnProperty.call(memoryStore, key)) return { key, value: memoryStore[key] };
    return null;
  }
}
async function storageDelete(key){
  delete memoryStore[key];
  try{
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ /* already removed from memoryStore above; nothing more to do */ }
}
async function storageList(prefix){
  let dbKeys = [];
  try{
    const db = await openDb();
    dbKeys = await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ /* fall through to memory-only keys below */ }
  const memKeys = Object.keys(memoryStore);
  const all = Array.from(new Set([...dbKeys, ...memKeys]));
  return { keys: prefix ? all.filter(k => k.startsWith(prefix)) : all };
}

/* ================= Crypto layer ================= */
function bufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk)); }
  return btoa(binary);
}
function base64ToBuf(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function deriveKey(passphrase, saltBytes, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBytes, iterations: iterations, hash:'SHA-256' },
    keyMaterial,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}
async function encryptString(key, plaintext){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(plaintext);
  const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, encoded);
  const combined = new Uint8Array(iv.length + cipherBuf.byteLength);
  combined.set(iv, 0); combined.set(new Uint8Array(cipherBuf), iv.length);
  return bufToBase64(combined.buffer);
}
async function decryptString(key, payloadB64){
  const combined = new Uint8Array(base64ToBuf(payloadB64));
  const iv = combined.slice(0,12);
  const cipherBytes = combined.slice(12);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipherBytes);
  return new TextDecoder().decode(plainBuf);
}
async function secureGet(key){
  try{
    const res = await storageGet(key);
    if(!res) return null;
    const plain = await decryptString(state.cryptoKey, res.value);
    return JSON.parse(plain);
  }catch(e){ return null; }
}
async function secureSet(key, obj){
  const plain = JSON.stringify(obj);
  const enc = await encryptString(state.cryptoKey, plain);
  await storageSet(key, enc, false);
}

/* ---- Master-key wrapping (lets either the passphrase OR the
   recovery key unlock the same data) ----
   A random 256-bit master key is generated once and used for all
   actual data encryption (state.cryptoKey). It's never stored in
   the clear — instead it's "wrapped" (encrypted) twice: once with
   a key derived from the passphrase, once with a key derived from
   the recovery code. Either secret can unwrap the same master key,
   the same way Bitwarden/Signal/disk-encryption recovery works. */
async function importMasterKey(rawBytes){
  return crypto.subtle.importKey('raw', rawBytes, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function wrapMasterKey(masterKeyBytes, wrappingKey){
  return encryptString(wrappingKey, bufToBase64(masterKeyBytes.buffer));
}
async function unwrapMasterKey(wrapped, wrappingKey){
  const b64 = await decryptString(wrappingKey, wrapped);
  return new Uint8Array(base64ToBuf(b64));
}

const RECOVERY_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // Crockford base32 — no I/L/O/U to avoid transcription mixups
function bytesToRecoveryChars(bytes){
  let bits = 0, value = 0, out = '';
  for(let i=0;i<bytes.length;i++){
    value = (value << 8) | bytes[i];
    bits += 8;
    while(bits >= 5){ out += RECOVERY_ALPHABET[(value >>> (bits-5)) & 31]; bits -= 5; }
  }
  if(bits > 0) out += RECOVERY_ALPHABET[(value << (5-bits)) & 31];
  return out;
}
function generateRecoveryCode(){
  const bytes = crypto.getRandomValues(new Uint8Array(16)); // 128 bits of entropy
  const raw = bytesToRecoveryChars(bytes);
  return raw.match(/.{1,5}/g).join('-');
}
function normalizeRecoveryCode(input){
  return (input||'').toUpperCase().replace(/[^0-9A-Z]/g, '');
}

const CRYPTO_AVAILABLE = !!(window.crypto && window.crypto.subtle && window.crypto.subtle.importKey);

/* ================= Boot / auth ================= */
const PAYMENT_LINK_URL = "https://roundwork.gumroad.com/l/Subscription";

async function boot(){
  let paywallPassed = false;
  try{ paywallPassed = !!(await storageGet('paywall_passed')); }catch(e){ paywallPassed = false; }
  if(!paywallPassed){
    state.authMode = 'paywall';
    render();
    return;
  }
  await checkMetaAndProceed();
}

async function handlePaywallVerify(){
  const key = (document.getElementById('license_input').value || '').trim();
  if(!key){ state.authError = 'Please enter your license key.'; render(); return; }
  state.authBusy = true; state.authError=''; state.authStep='Verifying your license key…'; render();
  try{
    await withTimeout((async ()=>{
      const resp = await fetch('/.netlify/functions/verify-license', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ licenseKey: key })
      });
      const data = await resp.json();
      if(!data.valid){ throw new Error(data.message || 'That license key was not recognized.'); }
      try{ await storageSet('paywall_passed', 'true', false); }catch(e){}
      state.authBusy = false;
      state.authStep = '';
      await checkMetaAndProceed();
    })(), 15000, 'Verifying your license key');
  }catch(e){
    state.authBusy = false;
    state.authStep = '';
    state.authError = e && e.message ? e.message : 'Could not verify your license key. Please check it and try again.';
    render();
  }
}

async function checkMetaAndProceed(){
  try{
    const r = await withTimeout(storageGet('meta'), 10000, 'Loading your saved data');
    if(r){
      state.meta = JSON.parse(r.value);
      state.authMode = 'unlock';
    }
    else { state.authMode = 'setup'; }
  }catch(e){
    console.error('Boot failed', e);
    state.authMode = 'setup';
  }
  render();
}

async function handleSetupPassphrase(){
  const p1 = document.getElementById('setup_pass').value;
  const p2 = document.getElementById('setup_pass2').value;
  if(p1.length < 6){ state.authError = 'Use at least 6 characters.'; render(); return; }
  if(p1 !== p2){ state.authError = 'Passphrases do not match.'; render(); return; }
  state.authBusy = true; state.authError=''; state.authStep='Generating your encryption key…'; render();
  try{
    await withTimeout((async ()=>{
      const iterations = 250000;
      const masterKeyBytes = crypto.getRandomValues(new Uint8Array(32));

      const saltA = crypto.getRandomValues(new Uint8Array(16));
      const keyA = await deriveKey(p1, saltA, iterations);
      const wrappedKeyA = await wrapMasterKey(masterKeyBytes, keyA);
      state.authStep = 'Creating your recovery key…'; render();

      const recoveryCode = generateRecoveryCode();
      const saltB = crypto.getRandomValues(new Uint8Array(16));
      const keyB = await deriveKey(normalizeRecoveryCode(recoveryCode), saltB, iterations);
      const wrappedKeyB = await wrapMasterKey(masterKeyBytes, keyB);

      state.authStep = 'Saving your settings…'; render();
      const meta = {
        iterations,
        saltA: bufToBase64(saltA.buffer), wrappedKeyA,
        saltB: bufToBase64(saltB.buffer), wrappedKeyB
      };
      await storageSet('meta', JSON.stringify(meta), false);
      state.meta = meta;
      state.cryptoKey = await importMasterKey(masterKeyBytes);
      state.pendingRecoveryCode = recoveryCode;
      state.authBusy = false;
      state.authStep = '';
      state.authMode = 'showRecoveryKey';
      render();
    })(), 10000, 'Setting up');
  }catch(e){
    console.error('Setup failed at step: ' + state.authStep, e);
    state.authBusy = false;
    state.authMode = 'setup';
    state.authError = "Got stuck at \"" + (state.authStep||'starting') + "\" — " + (e && e.message ? e.message : 'unknown error') + ". Try again, or open this file in a full, up-to-date browser tab.";
    state.authStep = '';
    render();
  }
}

async function handleAckRecoveryKey(){
  const checkbox = document.getElementById('recoveryAckBox');
  if(!checkbox || !checkbox.checked){
    state.authError = "Please check the box confirming you've saved your recovery key — it can't be shown again.";
    render();
    return;
  }
  state.pendingRecoveryCode = '';
  state.authError = '';
  state.authStep = 'Loading your caseload…';
  state.authMode = 'unlocked';
  render();
  await bootAppData();
}

async function handleUnlock(){
  const p = document.getElementById('unlock_pass').value;
  state.authBusy = true; state.authError=''; state.authStep='Checking your passphrase…'; render();
  try{
    await withTimeout((async ()=>{
      const saltA = new Uint8Array(base64ToBuf(state.meta.saltA));
      const keyA = await deriveKey(p, saltA, state.meta.iterations);
      const masterKeyBytes = await unwrapMasterKey(state.meta.wrappedKeyA, keyA);
      state.cryptoKey = await importMasterKey(masterKeyBytes);
      state.authStep = 'Loading your caseload…';
      state.authMode = 'unlocked';
      state.authBusy = false;
      render();
      await bootAppData();
    })(), 10000, 'Unlocking');
  }catch(e){
    const timedOut = e && e.message && e.message.indexOf('timed out')>=0;
    state.authBusy = false;
    state.authMode = 'unlock';
    state.authError = timedOut ? ("Got stuck at \"" + (state.authStep||'starting') + "\" — " + e.message) : 'Incorrect passphrase. Try again.';
    state.authStep = '';
    render();
  }
}

async function handleUnlockWithRecovery(){
  const code = document.getElementById('recovery_input').value;
  state.authBusy = true; state.authError=''; state.authStep='Checking your recovery key…'; render();
  try{
    await withTimeout((async ()=>{
      const saltB = new Uint8Array(base64ToBuf(state.meta.saltB));
      const keyB = await deriveKey(normalizeRecoveryCode(code), saltB, state.meta.iterations);
      const masterKeyBytes = await unwrapMasterKey(state.meta.wrappedKeyB, keyB);
      state.recoveredMasterKeyBytes = masterKeyBytes;
      state.cryptoKey = await importMasterKey(masterKeyBytes);
      state.authBusy = false;
      state.authStep = '';
      state.authMode = 'setNewPassphrase';
      render();
    })(), 10000, 'Checking recovery key');
  }catch(e){
    const timedOut = e && e.message && e.message.indexOf('timed out')>=0;
    state.authBusy = false;
    state.authError = timedOut ? ("Got stuck at \"" + (state.authStep||'starting') + "\" — " + e.message) : "That recovery key doesn't match. Double-check each character and try again.";
    state.authStep = '';
    render();
  }
}

async function handleSetNewPassphraseAfterRecovery(){
  const p1 = document.getElementById('newpass_1').value;
  const p2 = document.getElementById('newpass_2').value;
  if(p1.length < 6){ state.authError = 'Use at least 6 characters.'; render(); return; }
  if(p1 !== p2){ state.authError = 'Passphrases do not match.'; render(); return; }
  state.authBusy = true; state.authError=''; state.authStep='Saving your new passphrase…'; render();
  try{
    await withTimeout((async ()=>{
      const masterKeyBytes = state.recoveredMasterKeyBytes;
      const iterations = state.meta.iterations;
      const saltA = crypto.getRandomValues(new Uint8Array(16));
      const keyA = await deriveKey(p1, saltA, iterations);
      const wrappedKeyA = await wrapMasterKey(masterKeyBytes, keyA);
      const meta = { ...state.meta, saltA: bufToBase64(saltA.buffer), wrappedKeyA };
      await storageSet('meta', JSON.stringify(meta), false);
      state.meta = meta;
      state.recoveredMasterKeyBytes = null;
      state.authStep = 'Loading your caseload…';
      state.authMode = 'unlocked';
      state.authBusy = false;
      render();
      await bootAppData();
    })(), 10000, 'Saving new passphrase');
  }catch(e){
    state.authBusy = false;
    state.authMode = 'setNewPassphrase';
    state.authError = "Something went wrong saving your new passphrase (" + (e && e.message ? e.message : 'unknown error') + "). Try again.";
    state.authStep = '';
    render();
  }
}

/* ---- Auto-lock after inactivity ---- */
const IDLE_LIMIT_MS = 5 * 60 * 1000; // 5 minutes
let idleTimer = null;
let idleWarnTimer = null;
function resetIdleTimer(){
  if(state.authMode !== 'unlocked') return;
  if(idleTimer) clearTimeout(idleTimer);
  if(idleWarnTimer) clearTimeout(idleWarnTimer);
  // quiet warning toast 30s before locking, so a session doesn't vanish with no notice
  idleWarnTimer = setTimeout(showIdleWarning, IDLE_LIMIT_MS - 30000);
  idleTimer = setTimeout(()=>{ lockApp(true); }, IDLE_LIMIT_MS);
}
function showIdleWarning(){
  if(state.authMode !== 'unlocked' || document.getElementById('idleToast')) return;
  const t = document.createElement('div');
  t.id = 'idleToast';
  t.style.cssText = 'position:fixed; bottom:90px; right:20px; background:#234F47; color:#fff; padding:10px 16px; border-radius:8px; font-size:0.82rem; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,0.2);';
  t.textContent = 'Locking soon due to inactivity…';
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 28000);
}
['mousemove','keydown','click','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, resetIdleTimer, { passive:true });
});

function lockApp(dueToIdle){
  state.cryptoKey = null;
  state.authMode = 'unlock';
  state.clients = []; state.notesCache = {}; state.appointments = []; state.attachIndexCache = {};
  state.view = 'dashboard';
  state.authError = dueToIdle ? 'Locked after 5 minutes of inactivity.' : '';
  if(idleTimer) clearTimeout(idleTimer);
  if(idleWarnTimer) clearTimeout(idleWarnTimer);
  const toast = document.getElementById('idleToast'); if(toast) toast.remove();
  render();
}

async function resetAllData(){
  showConfirmModal('This permanently deletes every client, note, appointment, and file stored in this app on this device. This cannot be undone. Continue?', ()=>{
    showConfirmModal('Are you completely sure? There is no way to undo this.', async ()=>{
      try{
        const res = await storageList('', false);
        const keys = (res && res.keys) ? res.keys : [];
        for(const k of keys){ try{ await storageDelete(k, false); }catch(e){} }
      }catch(e){ console.error(e); }
      state.meta = null; state.cryptoKey = null; state.authMode = 'setup'; state.authError='';
      state.clients=[]; state.notesCache={}; state.appointments=[]; state.attachIndexCache={};
      render();
    }, {danger:true, okLabel:'Delete everything'});
  }, {danger:true, okLabel:'Continue'});
}

async function bootAppData(){
  state.clients = (await secureGet('clients')) || [];
  state.appointments = (await secureGet('appointments')) || [];
  try{ await migrateNextSessions(); }catch(e){ console.error('Migration failed', e); }
  resetIdleTimer();
  render();
  maybeShowInstallTip();
}

async function maybeShowInstallTip(){
  try{
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if(isStandalone) return; // already installed/running as an app -- nothing to suggest
    const already = await storageGet('pwa_tip_shown');
    if(already) return;
  }catch(e){ return; } // if we can't tell either way, don't risk nagging

  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  let msg;
  if(isIOS) msg = 'Tip: tap the Share icon, then "Add to Home Screen" to use Roundwork like an app.';
  else if(isAndroid) msg = 'Tip: tap the menu (⋮) and choose "Install app" to use Roundwork like an app.';
  else msg = "Tip: look for an install icon in your browser's address bar to add Roundwork as an app.";

  const el = document.createElement('div');
  el.id = 'installTipBanner';
  el.style.cssText = 'position:fixed; bottom:90px; left:16px; right:16px; max-width:420px; margin:0 auto; background:#234F47; color:#fff; padding:12px 14px; border-radius:10px; font-size:0.85rem; line-height:1.4; z-index:500; box-shadow:0 6px 18px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px;';
  el.innerHTML = `<span style="flex:1;">${escapeHtml(msg)}</span><button id="installTipClose" style="background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer; line-height:1; padding:2px 6px;">✕</button>`;
  document.body.appendChild(el);
  const closeBtn = document.getElementById('installTipClose');
  if(closeBtn) closeBtn.addEventListener('click', () => { el.remove(); });

  // Mark as shown right away (not just on dismiss) -- this is meant to be a
  // one-time tip, not a recurring nag every time the app is opened.
  try{ await storageSet('pwa_tip_shown', 'true', false); }catch(e){}
}

async function migrateNextSessions(){
  let already = false;
  try{ const r = await storageGet('migrated_v2'); already = !!r; }catch(e){ already = false; }
  if(already) return;
  let changed = false;
  for(const c of state.clients){
    if(c.nextSession){
      const exists = state.appointments.some(a => a.clientId===c.id && a.date===c.nextSession);
      if(!exists){
        state.appointments.push({ id:uid('appt'), clientId:c.id, date:c.nextSession, time:'', durationMin:'', type:'Treatment', notes:'', status:'scheduled' });
        changed = true;
      }
    }
  }
  if(changed) await saveAppointments();
  try{ await storageSet('migrated_v2', 'true', false); }catch(e){}
}

async function saveClients(){ await secureSet('clients', state.clients); }
async function loadNotes(clientId){
  if(state.notesCache[clientId]) return state.notesCache[clientId];
  state.notesCache[clientId] = (await secureGet('notes:'+clientId)) || [];
  return state.notesCache[clientId];
}
async function saveNotes(clientId, notes){ state.notesCache[clientId] = notes; await secureSet('notes:'+clientId, notes); }
async function saveAppointments(){ await secureSet('appointments', state.appointments); }
async function loadAttachIndex(clientId){
  if(state.attachIndexCache[clientId]) return state.attachIndexCache[clientId];
  state.attachIndexCache[clientId] = (await secureGet('attach_index:'+clientId)) || [];
  return state.attachIndexCache[clientId];
}

/* ================= Top-level render ================= */
function render(){
  const app = document.getElementById('app');
  const authScreens = { paywall: renderPaywallScreen, setup: renderSetupScreen, showRecoveryKey: renderRecoveryKeyScreen, unlock: renderUnlockScreen, unlockRecovery: renderUnlockRecoveryScreen, setNewPassphrase: renderSetNewPassphraseScreen };
  if(state.authMode === 'checking'){ app.innerHTML = ''; return; }
  if(authScreens[state.authMode]){ app.innerHTML = authScreens[state.authMode](); attachAuthHandlers(); return; }
  app.innerHTML = `${renderSidebar()}<main>${renderView()}</main>`;
  attachGlobalHandlers();
}

function attachAuthHandlers(){
  const paywallVerifyBtn = document.getElementById('paywallVerifyBtn');
  if(paywallVerifyBtn) paywallVerifyBtn.addEventListener('click', handlePaywallVerify);
  const setupBtn = document.getElementById('setupBtn');
  if(setupBtn) setupBtn.addEventListener('click', handleSetupPassphrase);
  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.addEventListener('click', handleUnlock);
  const forgotLink = document.getElementById('forgotLink');
  if(forgotLink) forgotLink.addEventListener('click', resetAllData);
  const useRecoveryLink = document.getElementById('useRecoveryLink');
  if(useRecoveryLink) useRecoveryLink.addEventListener('click', ()=>{ state.authError=''; state.authMode='unlockRecovery'; render(); });
  const backToPasswordLink = document.getElementById('backToPasswordLink');
  if(backToPasswordLink) backToPasswordLink.addEventListener('click', ()=>{ state.authError=''; state.authMode='unlock'; render(); });
  const unlockRecoveryBtn = document.getElementById('unlockRecoveryBtn');
  if(unlockRecoveryBtn) unlockRecoveryBtn.addEventListener('click', handleUnlockWithRecovery);
  const recoveryAckBtn = document.getElementById('recoveryAckBtn');
  if(recoveryAckBtn) recoveryAckBtn.addEventListener('click', handleAckRecoveryKey);
  const copyRecoveryBtn = document.getElementById('copyRecoveryBtn');
  if(copyRecoveryBtn) copyRecoveryBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(state.pendingRecoveryCode);
      copyRecoveryBtn.textContent = 'Copied!';
      setTimeout(()=>{ copyRecoveryBtn.textContent = 'Copy to clipboard'; }, 2000);
    }catch(e){ showAlertModal('Could not copy automatically — please select and copy the code manually.'); }
  });
  const newPassBtn = document.getElementById('newPassBtn');
  if(newPassBtn) newPassBtn.addEventListener('click', handleSetNewPassphraseAfterRecovery);
  document.querySelectorAll('#setup_pass2, #unlock_pass, #recovery_input, #newpass_2, #license_input').forEach(el=>{
    el.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      if(el.id==='unlock_pass') handleUnlock();
      else if(el.id==='recovery_input') handleUnlockWithRecovery();
      else if(el.id==='newpass_2') handleSetNewPassphraseAfterRecovery();
      else if(el.id==='license_input') handlePaywallVerify();
      else handleSetupPassphrase();
    });
  });
}

function renderView(){
  if(state.view==='dashboard') return renderDashboard();
  if(state.view==='calendar') return renderCalendarView();
  if(state.view==='caseload') return renderCaseload();
  if(state.view==='newclient') return renderClientForm();
  if(state.view==='client') return renderClientDetail();
  return '';
}

/* ================= Dashboard ================= */
function getUpcomingAppointments(limit){
  const today = todayISO();
  return state.appointments
    .filter(a => a.status !== 'cancelled' && a.date >= today)
    .sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))
    .slice(0, limit)
    .map(a => ({ ...a, client: state.clients.find(c=>c.id===a.clientId) }))
    .filter(a => a.client);
}

function renderDashboard(){
  const active = state.clients.filter(c=>c.status==='active').length;
  const hold = state.clients.filter(c=>c.status==='hold').length;
  const discharged = state.clients.filter(c=>c.status==='discharged').length;
  const total = state.clients.length;
  const upcoming = getUpcomingAppointments(5);

  return `
    <div class="page-head">
      <h1>Good to see you</h1>
      <p>Here's where your caseload stands today.</p>
    </div>
    <div class="grid-stats">
      <div class="stat"><div class="num">${total}</div><div class="lbl">Total caseload</div></div>
      <div class="stat"><div class="num">${active}</div><div class="lbl">Active</div></div>
      <div class="stat"><div class="num">${hold}</div><div class="lbl">On hold</div></div>
      <div class="stat"><div class="num">${discharged}</div><div class="lbl">Discharged</div></div>
    </div>

/* ================= Calendar ================= */
function renderCalendarView(){
  const { year, month } = state.calendar;
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const todayIso = todayISO();

  const cells = [];
  for(let i=0;i<startDow;i++){ cells.push({ day: daysInPrevMonth-startDow+1+i, other:true, iso:null }); }
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day:d, other:false, iso });
  }
  while(cells.length % 7 !== 0){ cells.push({ day: cells.length, other:true, iso:null }); }

  function apptsFor(iso){
    return state.appointments.filter(a=>a.date===iso).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  }

  return `
    <div class="page-head"><h1>Calendar</h1><p>All scheduled sessions across your caseload.</p></div>
    <div class="cal-header">
      <div class="cal-nav">
        <button class="btn ghost" id="calPrev">&larr;</button>
        <div class="cal-monthlabel">${MONTH_NAMES[month]} ${year}</div>
        <button class="btn ghost" id="calNext">&rarr;</button>
        <button class="btn ghost" id="calToday">Today</button>
      </div>
      <button class="btn" id="newApptBtn">+ New appointment</button>
    </div>
    <div class="cal-grid" style="margin-bottom:6px;">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">
      ${cells.map(c => {
        if(c.other) return `<div class="cal-cell other-month"><div class="cal-daynum">${c.day}</div></div>`;
        const appts = apptsFor(c.iso);
        const shown = appts.slice(0,3);
        const extra = appts.length - shown.length;
        return `<div class="cal-cell ${c.iso===todayIso?'today':''}" data-day="${c.iso}">
          <div class="cal-daynum">${c.day}</div>
          ${shown.map(a => {
            const cl = state.clients.find(x=>x.id===a.clientId);
            return `<div class="cal-chip ${a.status}" data-appt="${a.id}">${a.time?a.time+' ':''}${escapeHtml(cl?cl.name:'—')}</div>`;
          }).join('')}
          ${extra>0 ? `<div class="cal-more">+${extra} more</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function openApptModal(appt, prefillDate, prefillClientId){
  const wrap = document.createElement('div');

  document.getElementById('apptModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='apptModalBackdrop') closeApptModal(); });
  document.getElementById('saveApptBtn').onclick = () => saveApptFromModal(appt);
  const delBtn = document.getElementById('deleteApptBtn');
  if(delBtn) delBtn.onclick = () => deleteAppt(appt.id);
}
function closeApptModal(){ const el = document.getElementById('apptModalBackdrop'); if(el) el.remove(); }
async function saveApptFromModal(existing){
  const clientId = document.getElementById('a_client').value;
  if(!clientId){ showAlertModal('Please choose a client.'); return; }
  const payload = {
    id: existing && existing.id ? existing.id : uid('appt'),
    clientId,
    date: document.getElementById('a_date').value || todayISO(),
    time: document.getElementById('a_time').value,
    type: document.getElementById('a_type').value,
    durationMin: document.getElementById('a_duration').value,
    status: document.getElementById('a_status').value,
    notes: document.getElementById('a_notes').value.trim(),
  };
  const idx = state.appointments.findIndex(a=>a.id===payload.id);
  if(idx>=0) state.appointments[idx] = payload; else state.appointments.push(payload);
  await saveAppointments();
  closeApptModal();
  render();
}
async function deleteAppt(id){
  showConfirmModal('Delete this appointment?', async ()=>{
    state.appointments = state.appointments.filter(a=>a.id!==id);
    await saveAppointments();
    closeApptModal();
    render();
  }, {danger:true, okLabel:'Delete'});

  const payload = {
    id: existing && existing.id ? existing.id : uid('client'),
    name,
    therapyType: document.getElementById('f_type').value,
    status: document.getElementById('f_status').value,
    diagnosis: document.getElementById('f_diagnosis').value.trim(),
    startDate: document.getElementById('f_start').value,
    goals: document.getElementById('f_goals').value.trim(),
    nextSession: existing ? existing.nextSession : ''
  };
  const idx = state.clients.findIndex(c=>c.id===payload.id);
  if(idx>=0) state.clients[idx] = payload; else state.clients.push(payload);
  await saveClients();
  state.editingClient = null;
  goto('client', { clientId: payload.id, clientTab:'notes' });

async function handleDeleteClient(){
  showConfirmModal('Delete this client, their notes, appointments, and files? This cannot be undone.', async ()=>{
    const id = state.editingClient.id;
    state.clients = state.clients.filter(c=>c.id!==id);
    state.appointments = state.appointments.filter(a=>a.clientId!==id);
    await saveClients(); await saveAppointments();
    try{ await storageDelete('notes:'+id, false); }catch(e){}
    try{ await storageDelete('attach_index:'+id, false); }catch(e){}
    state.editingClient = null;
    goto('caseload');
  }, {danger:true, okLabel:'Delete'});
}

        <button class="btn ghost" style="padding:6px 12px; font-size:0.78rem;" data-deletefile="${f.id}" data-client="${c.id}">Delete</button>
      </div>
    `).join('') }
  `;
}

/* ================= Note modal ================= */

    <div class="modal-backdrop" id="noteModalBackdrop">
      <div class="modal">
        <h2>${n.id ? 'Edit note' : 'New session note'}</h2>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="n_date" value="${n.date}"></div>
          <div class="field">
            <label>Session type</label>
            <select id="n_type">
              ${['Evaluation','Treatment','Re-evaluation','Discharge'].map(t=>`<option ${n.sessionType===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field"><label>Duration (minutes)</label><input type="number" id="n_duration" value="${n.duration||''}" min="0" style="max-width:120px;"></div>
        <div class="field"><label>Subjective</label><textarea id="n_subjective" rows="2" placeholder="Patient-reported symptoms, concerns…">${escapeHtml(n.subjective)}</textarea></div>
        <div class="field"><label>Objective</label><textarea id="n_objective" rows="2" placeholder="Measurements, observations, tests performed…">${escapeHtml(n.objective)}</textarea></div>
        <div class="field"><label>Assessment</label><textarea id="n_assessment" rows="2" placeholder="Clinical interpretation, progress toward goals…">${escapeHtml(n.assessment)}</textarea></div>
        <div class="field"><label>Plan</label><textarea id="n_plan" rows="2" placeholder="Next steps, home exercise updates…">${escapeHtml(n.plan)}</textarea></div>

        <div class="modal-actions">

function openNoteModal(note){
  const wrap = document.createElement('div');
  wrap.innerHTML = noteModalHtml(note);
  document.body.appendChild(wrap.firstElementChild);
  document.getElementById('cancelNoteBtn').onclick = closeNoteModal;
  document.getElementById('noteModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='noteModalBackdrop') closeNoteModal(); });
  document.getElementById('saveNoteBtn').onclick = () => saveNoteFromModal(note);

function closeNoteModal(){ const el = document.getElementById('noteModalBackdrop'); if(el) el.remove(); }

/* ---- Custom confirm/alert dialogs ----
   Native window.confirm()/alert() are silently blocked in some
   hosting contexts (e.g. sandboxed iframes without "allow-modals"),
   which fails with zero visible feedback — a click just appears to
   do nothing. These in-app equivalents don't depend on that browser
   API at all, so they work the same everywhere the app itself runs. */
function showConfirmModal(message, onConfirm, options={}){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="modal-backdrop" id="confirmModalBackdrop">
      <div class="modal" style="max-width:420px;">
        <p style="font-size:0.95rem; line-height:1.5; margin-top:0;">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn ghost" id="confirmCancelBtn">${escapeHtml(options.cancelLabel||'Cancel')}</button>
          <button class="btn ${options.danger?'danger':''}" id="confirmOkBtn">${escapeHtml(options.okLabel||'Confirm')}</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(wrap.firstElementChild);
  const close = ()=>{ const el = document.getElementById('confirmModalBackdrop'); if(el) el.remove(); };
  document.getElementById('confirmCancelBtn').onclick = close;
  document.getElementById('confirmModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='confirmModalBackdrop') close(); });
  document.getElementById('confirmOkBtn').onclick = ()=>{ close(); onConfirm(); };
}
function showAlertModal(message){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="modal-backdrop" id="alertModalBackdrop">
      <div class="modal" style="max-width:420px;">
        <p style="font-size:0.95rem; line-height:1.5; margin-top:0;">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn" id="alertOkBtn">OK</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(wrap.firstElementChild);
  const close = ()=>{ const el = document.getElementById('alertModalBackdrop'); if(el) el.remove(); };
  document.getElementById('alertOkBtn').onclick = close;
  document.getElementById('alertModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='alertModalBackdrop') close(); });
}
async function saveNoteFromModal(existing){
  const clientId = state.clientId;
  const notes = state.notesCache[clientId] || [];
  const payload = {
    id: existing && existing.id ? existing.id : uid('note'),
    date: document.getElementById('n_date').value || todayISO(),
    sessionType: document.getElementById('n_type').value,
    duration: document.getElementById('n_duration').value,
    subjective: document.getElementById('n_subjective').value.trim(),
    objective: document.getElementById('n_objective').value.trim(),
    assessment: document.getElementById('n_assessment').value.trim(),
    plan: document.getElementById('n_plan').value.trim(),
    transcript: existing ? existing.transcript : (state._pendingTranscript || ''),
  };
  const idx = notes.findIndex(n=>n.id===payload.id);
  if(idx>=0) notes[idx] = payload; else notes.push(payload);
  await saveNotes(clientId, notes);
  state._pendingTranscript = '';
  closeNoteModal();
  render();
}
async function deleteNote(clientId, noteId){
  showConfirmModal('Delete this note?', async ()=>{
    const notes = (state.notesCache[clientId]||[]).filter(n=>n.id!==noteId);
    await saveNotes(clientId, notes);
    render();
  }, {danger:true, okLabel:'Delete'});
}

/* ================= Recording ================= */
function initSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ state.recording.supported = false; return null; }
  const recog = new SR();
  recog.continuous = true;
  recog.interimResults = true;
  recog.lang = 'en-US';
  let finalTranscript = state.recording.transcript || '';
  recog.onresult = (event) => {
    let interim = '';
    for(let i=event.resultIndex; i<event.results.length; i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalTranscript += t + ' ';
      else interim += t;
    }
    state.recording.transcript = finalTranscript;
    const box = document.getElementById('transcriptBox');
    if(box) box.textContent = (finalTranscript + interim).trim() || 'Listening…';
  };
  recog.onerror = (e) => {
    console.warn('Speech recognition error', e.error);
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      state.recording.error = 'Live transcription was blocked by the browser. If audio recording still worked, you can transcribe it yourself afterward.';
      render();
    } else if(e.error === 'network'){
      state.recording.error = "Live transcription needs a network connection and lost it — it may resume on its own, or you can write the note manually.";
      render();
    } else if(e.error === 'no-speech'){
      // benign — just means it hasn't heard anything yet, no need to surface
    }
  };
  recog.onend = () => { if(state.recording.active) { try{ recog.start(); }catch(e){} } };
  return recog;
}

function micErrorMessage(e){
  const name = e && e.name;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return "This browser context doesn't allow microphone access (common in embedded previews). Try opening this file in its own browser tab.";
  }
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError'){
    return "Microphone access was blocked or denied. If you're in an embedded preview, try opening this file in its own browser tab and allow the microphone when your browser asks.";
  }
  if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    return "No microphone was found on this device.";
  }
  if(name === 'NotReadableError' || name === 'TrackStartError'){
    return "The microphone couldn't be started — it may be in use by another app.";
  }
  return "Couldn't access the microphone (" + (e && e.message ? e.message : (name || 'unknown error')) + "). Try opening this file in its own browser tab.";
}

async function startRecording(){
  const r = state.recording;
  r.transcript=''; r.seconds=0; r.audioUrl=null; r.chunks=[]; r.error='';

  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(e){
    console.warn('Microphone access failed', e);
    r.error = micErrorMessage(e);
    render();
    return;
  }

  r.active = true;
  render();

  const recog = initSpeechRecognition();
  r.recog = recog;
  if(recog){ try{ recog.start(); }catch(e){ console.warn('Speech recognition failed to start', e); } }

  try{
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = (e) => { if(e.data.size>0) r.chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(r.chunks, { type:'audio/webm' });
      r.audioUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      render();
    };
    mr.start();
    r.mediaRecorder = mr;
  }catch(e){
    console.warn('Audio capture unavailable, continuing with live transcript only', e);
    stream.getTracks().forEach(t=>t.stop());
  }

  r.timer = setInterval(()=>{ r.seconds++; const el = document.querySelector('.rec-timer'); if(el) el.textContent = fmtTime(r.seconds); }, 1000);
  render();
}
function downloadRecordedAudio(){
  const r = state.recording;
  if(!r.audioUrl) return;
  showConfirmModal("This audio file will be saved to your device as a plain, unencrypted file — outside Roundwork's protection. Anyone with access to your downloads folder, or a cloud backup of it, could open it. Continue?", ()=>{
    const a = document.createElement('a');
    a.href = r.audioUrl;
    a.download = 'session-recording-' + todayISO() + '.webm';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }, {okLabel:'Download anyway'});
}
function stopRecording(){
  const r = state.recording;
  r.active = false;
  if(r.timer){ clearInterval(r.timer); r.timer=null; }
  if(r.recog){ try{ r.recog.stop(); }catch(e){} }
  if(r.mediaRecorder && r.mediaRecorder.state !== 'inactive'){ r.mediaRecorder.stop(); }
  render();
}

/* ================= Attachments ================= */
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width=maxDim; }
          else { width = Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function readAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function addAttachment(clientId, file){
  const MAX_CHARS = 8000000;
  let dataUrl;
  const isImage = (file.type||'').startsWith('image/');
  if(isImage){
    dataUrl = await compressImage(file, 1400, 0.8);
    if(dataUrl.length > MAX_CHARS) dataUrl = await compressImage(file, 1200, 0.6);
    if(dataUrl.length > MAX_CHARS) dataUrl = await compressImage(file, 1000, 0.4);
    if(dataUrl.length > MAX_CHARS){ showAlertModal('This photo is still too large to store even after compression. Try a lower-resolution photo.'); return; }
  } else {
    if(file.size > 10000000){ showAlertModal('This file is too large to store on-device (limit ~10MB for non-image files). Try a smaller or compressed file.'); return; }
    dataUrl = await readAsDataUrl(file);
  }
  const id = uid('file');
  const meta = { id, name:file.name, mimeType:file.type||'application/octet-stream', size:file.size, addedDate:new Date().toISOString() };
  await secureSet('attach_blob:'+clientId+':'+id, { dataUrl });
  const idx = await loadAttachIndex(clientId);
  idx.push(meta);
  await saveAttachIndex(clientId, idx);
  render();
}
async function viewAttachment(clientId, id){
  const blob = await secureGet('attach_blob:'+clientId+':'+id);
  if(!blob){ showAlertModal('Could not load this file.'); return; }
  const meta = (state.attachIndexCache[clientId]||[]).find(f=>f.id===id);
  const wrap = document.createElement('div');
  const isImage = meta && meta.mimeType && meta.mimeType.startsWith('image/');
  wrap.innerHTML = `
    <div class="modal-backdrop" id="fileModalBackdrop">
      <div class="modal" style="max-width:640px;">
        <h2>${escapeHtml(meta ? meta.name : 'File')}</h2>
        ${ isImage ? `<img src="${blob.dataUrl}" style="max-width:100%; border-radius:8px; border:1px solid var(--line);">` :
          `<p style="font-size:0.88rem; color:var(--ink-soft);">Preview isn't available for this file type. Download it to view.</p>` }
        <div class="modal-actions">
          <button class="btn ghost" id="closeFileBtn">Close</button>
          <a class="btn" id="downloadFileBtn" download="${escapeHtml(meta?meta.name:'file')}" href="${blob.dataUrl}">Download</a>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(wrap.firstElementChild);
  document.getElementById('closeFileBtn').onclick = ()=> document.getElementById('fileModalBackdrop').remove();
  document.getElementById('fileModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='fileModalBackdrop') e.target.remove(); });
}
async function deleteAttachment(clientId, id){
  showConfirmModal('Delete this file?', async ()=>{
    const idx = (state.attachIndexCache[clientId]||[]).filter(f=>f.id!==id);
    await saveAttachIndex(clientId, idx);
    try{ await storageDelete('attach_blob:'+clientId+':'+id, false); }catch(e){}
    render();
  }, {danger:true, okLabel:'Delete'});
}

/* ================= Event wiring ================= */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const view = el.getAttribute('data-nav');
      if(view==='newclient') state.editingClient = null;
      goto(view);
    });
  });
  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn) lockBtn.addEventListener('click', lockApp);

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openClient(el.getAttribute('data-open')));
  });
  document.querySelectorAll('[data-editclient]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const c = state.clients.find(x=>x.id===el.getAttribute('data-editclient'));
      state.editingClient = c;
      goto('newclient');
    });
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      state.search = e.target.value; render();
      setTimeout(()=>{ const i=document.getElementById('searchInput'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0);
    });
  }

  const saveClientBtn = document.getElementById('saveClientBtn');
  if(saveClientBtn) saveClientBtn.addEventListener('click', handleSaveClient);
  const deleteClientBtn = document.getElementById('deleteClientBtn');
  if(deleteClientBtn) deleteClientBtn.addEventListener('click', handleDeleteClient);

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.clientTab = el.getAttribute('data-tab');
      if(state.clientTab==='files') await loadAttachIndex(state.clientId);
      render();
    });
  });

  document.querySelectorAll('[data-newnote]').forEach(el=>{ el.addEventListener('click', ()=> openNoteModal(null)); });
  document.querySelectorAll('[data-editnote]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const clientId = el.getAttribute('data-client');
      const note = (state.notesCache[clientId]||[]).find(n=>n.id===el.getAttribute('data-editnote'));
      openNoteModal(note);
    });
  });
  document.querySelectorAll('[data-deletenote]').forEach(el=>{
    el.addEventListener('click', ()=> deleteNote(el.getAttribute('data-client'), el.getAttribute('data-deletenote')));
  });

  const startRecBtn = document.getElementById('startRecBtn');
  if(startRecBtn) startRecBtn.addEventListener('click', startRecording);
  const stopRecBtn = document.getElementById('stopRecBtn');
  if(stopRecBtn) stopRecBtn.addEventListener('click', stopRecording);
  const useTranscriptBtn = document.getElementById('useTranscriptBtn');
  if(useTranscriptBtn) useTranscriptBtn.addEventListener('click', ()=>{ state._pendingTranscript = state.recording.transcript; openNoteModal(null); });
  const downloadAudioBtn = document.getElementById('downloadAudioBtn');
  if(downloadAudioBtn) downloadAudioBtn.addEventListener('click', downloadRecordedAudio);

  const fileInput = document.getElementById('fileInput');
  if(fileInput) fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(file) await addAttachment(state.clientId, file);
    e.target.value = '';
  });
  document.querySelectorAll('[data-viewfile]').forEach(el=>{
    el.addEventListener('click', ()=> viewAttachment(el.getAttribute('data-client'), el.getAttribute('data-viewfile')));
  });
  document.querySelectorAll('[data-deletefile]').forEach(el=>{
    el.addEventListener('click', ()=> deleteAttachment(el.getAttribute('data-client'), el.getAttribute('data-deletefile')));
  });

  const addSessionBtn = document.getElementById('addSessionBtn');
  if(addSessionBtn) addSessionBtn.addEventListener('click', ()=> openApptModal(null, todayISO(), state.clientId));
  document.querySelectorAll('[data-editsession]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const appt = state.appointments.find(a=>a.id===el.getAttribute('data-editsession'));
      openApptModal(appt);
    });
  });

  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.addEventListener('click', ()=>{ state.calendar.month--; if(state.calendar.month<0){ state.calendar.month=11; state.calendar.year--; } render(); });
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.addEventListener('click', ()=>{ state.calendar.month++; if(state.calendar.month>11){ state.calendar.month=0; state.calendar.year++; } render(); });
  const calToday = document.getElementById('calToday');
  if(calToday) calToday.addEventListener('click', ()=>{ const d=new Date(); state.calendar={year:d.getFullYear(), month:d.getMonth()}; render(); });
  const newApptBtn = document.getElementById('newApptBtn');
  if(newApptBtn) newApptBtn.addEventListener('click', ()=> openApptModal(null, todayISO(), null));
  document.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', ()=> openDayModal(el.getAttribute('data-day')));
  });
}

async function openClient(id){
  state.clientId = id;
  state.clientTab = 'notes';
  await loadNotes(id);
  goto('client', { clientId: id, clientTab:'notes' });
}

      console.warn('Service worker registration failed (app still works normally):', e);
